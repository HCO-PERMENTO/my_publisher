[project]
name = "my_publisher"
version = "0.1.0"
description = "Et nyt Python-projekt til at publicere noget fantastisk"
authors = [ { name = "Dit Navn", email = "you@example.com" } ]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.27",
  "fastmcp>=0.1"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
